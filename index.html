<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎓 Student Management System</h1>
    <p>Manage students and courses</p>
  </header>

  <main>
    <nav id="tabs">
      <button class="tab active" data-entity="student">Students</button>
      <button class="tab" data-entity="course">Courses</button>
    </nav>

    <section class="card">
      <h2 id="formTitle">Add Student</h2>
      <form id="form"></form>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2 id="listTitle">Students <span id="count" class="badge">0</span></h2>
        <input id="search" type="search" placeholder="Search...">
        <button id="reset" class="btn ghost" type="button">Reset sample data</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
